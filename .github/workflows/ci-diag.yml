name: CI Diagnostic

on:
  workflow_dispatch:
    inputs:
      test:
        type: string
        required: false
        default: 'basic'
        description: 'basic | checkout | go | clang | build'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Basic environment check
        id: env
        run: |
          echo "=== OS ===" && uname -a
          echo "=== Go ===" && which go || echo "no go"
          echo "=== Clang ===" && which clang && clang --version | head -1 || echo "no clang"
          echo "=== Make ===" && which make
          echo "=== Working dir ===" && pwd
          echo "=== Disk ===" && df -h / | tail -1

      - name: Checkout codebase
        if: ${{ contains(fromJSON('["basic","checkout","go","clang","build"]'), inputs.test) }}
        uses: actions/checkout@v6
        with:
          ref: v2.0-custom
          fetch-depth: 0

      - name: Verify checkout
        if: ${{ inputs.test != 'basic' }}
        id: checkout_verify
        run: |
          echo "=== Git HEAD ===" && git log -1 --oneline
          echo "=== Branch ===" && git branch --show-current
          echo "=== Files count ===" && git ls-files | wc -l
          echo "=== Go files ===" && find . -name '*.go' | wc -l
          echo "=== C files in kern/ ===" && find ./control/kern -name '*.c' 2>/dev/null | head -5
          echo "=== headers/ exists? ===" && ls control/kern/headers/errno-base.h 2>/dev/null && echo "YES" || echo "NO"
          echo "=== Makefile exists? ===" && ls Makefile && echo "YES" || echo "NO"
          echo "=== friendly-filenames.json? ===" && ls install/friendly-filenames.json && echo "YES" || echo "NO"

      - name: Set up Go
        if: ${{ contains(fromJSON('["go","build"]'), inputs.test) }}
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Check Go + download modules
        if: ${{ contains(fromJSON('["go","build"]'), inputs.test) }}
        run: |
          echo "Go version:" && go version
          echo "=== Submodules ===" 
          git submodule status
          echo "=== Init submodules ==="
          git submodule update --init --recursive 2>&1 | tail -5
          echo "=== Go mod download ==="
          GOMODCACHE="${PWD}"/go-mod go mod download -modcacherw 2>&1 | tail -10

      - name: Install clang+llvm
        if: ${{ contains(fromJSON('["clang","build"]'), inputs.test) }}
        run: |
          echo "Installing clang-15 llvm-15..."
          sudo apt-get update -y 2>&1 | tail -3
          sudo apt-get install -y clang-15 llvm-15 2>&1 | tail -5
          echo "clang-15 version:" && clang-15 --version | head -1
          echo "llvm-strip:" && which llvm-strip-15
          echo "BPF target support:" && clang-15 --print-targets | grep bpf || echo "NO BPF TARGET!"

      - name: Try build (just BPF compile)
        if: ${{ inputs.test == 'build' }}
        run: |
          export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
          export GOFLAGS="-trimpath -modcacherw"
          export GOEXPERIMENT="newinliner,simd,heapminimum512kib,randomizedheapbase64"
          export OUTPUT=build/dae-test
          export CLANG=clang-15
          export STRIP=llvm-strip-15
          export VERSION=ci-test
          mkdir -p build/
          echo "=== Building (first 50 lines of output) ==="
          make dae 2>&1 | head -60
          echo "=== Build exit code: $? ==="
          ls -la build/ 2>/dev/null
